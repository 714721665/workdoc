        <h1>阵列卡(raid卡)</h1>
        <p>raid卡分为扣卡和标卡两种</p>
        <h2>raid扣卡</h2>
        <p>扣卡为通过厂商自定义的插槽进行连接，直接由螺丝和插槽连接在主板上</p>
        <img src="../../pic/dis-mantle/raid/raidMwire.jpg" alt="raid扣卡(M)">
        <p>其中本图中的raid扣卡与主板用特殊引脚连接，并使用两颗螺丝固定并按照图中的线缆固定到4*2.5后置背板模组上</p>
        <h2>raid标卡</h2>
        <p>标卡是通过PCIe接口通过背板模组进行连接的，通过金手指连接</p>
        <img src="" alt="raid标卡(B)">
